[project]
name = "stock-prediction-system"
version = "0.1.0"
description = "End-to-End Stock Market Prediction System with FastAPI, Prefect, and Docker"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "pandas",
    "numpy<2.0",
    "scikit-learn",
    "prefect",
    "deepchecks",
    "alpha_vantage",
    "python-dotenv",
    "pydantic",
    "python-multipart",
    "joblib",
    "matplotlib",
    "streamlit",
    "plotly"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
